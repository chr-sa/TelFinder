[project]
name = "telfinder"
version = "0.1.0"
description = "TelFinder: a program for de novo detection of telomeric motif sequence"
readme = "README.txt"
authors = [
    { name = "bio-tombow", email = "tombow.bioinfo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.86",
]

[project.scripts]
telfinder = "telfinder:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
